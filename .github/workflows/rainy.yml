name: RabirubiaWeather Rain Virtual Forecast

on:
  schedule:
    # 5 AM Eastern
    - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pillow requests

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p public/weather

      - name: Download NOAA graphics
        run: |
          curl -L \
            https://www.weather.gov/images/sju/marine/wrf/nbm24hr_prec.png \
            -o downloads/24.png

          curl -L \
            https://www.weather.gov/images/sju/marine/wrf/nbm48hr_prec.png \
            -o downloads/48.png

          curl -L \
            https://www.weather.gov/images/sju/marine/wrf/nbm72hr_prec.png \
            -o downloads/72.png

          curl -L \
            https://www.weather.gov/images/sju/marine/verification/buoy/nws_virtual_buoys.png \
            -o downloads/buoys.png

      - name: Create forecast graphic
        run: |
          python scripts/create_collage.py

      - name: Commit graphic
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add public/weather/marine-forecast.jpg

          git diff --cached --quiet && exit 0

          git commit -m "Update Rain Virtual Forecast"

          git push
